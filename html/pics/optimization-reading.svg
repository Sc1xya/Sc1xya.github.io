    <rect x="2" y="152" width="500" height="10" rx="5" fill="#f2f0ea" fill-opacity=".26"/>
    <rect x="2" y="182" width="380" height="10" rx="5" fill="#f2f0ea" fill-opacity=".26"/>
    <g transform="translate(0 230)">
