<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post — Sc1xya</title>
    <link rel="stylesheet" href="../css/post.css" />
</head>

<body>
    <div class="site-title">
        <h1><a href="../index.html">Sc1xya</a></h1>
        <div class="line"></div>
    </div>

    <div class="container">
        <div class="markdown-body" id="content"></div>
        <a class="back-link" href="./posts_black.html">← Back to Posts</a>
    </div>

    <!-- Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        const contentEl = document.getElementById("content");

        async function loadPost() {
            if (!id) {
                contentEl.innerHTML = '<p class="error">No post id provided.</p>';
                return;
            }

            try {
                const response = await fetch(`./posts/${id}.md`);
                if (!response.ok) {
                    throw new Error("Post not found");
                }

                const markdown = await response.text();
                const html = marked.parse(markdown);
                contentEl.innerHTML = html;

                // 自动用文章第一个 h1 作为网页标题
                const firstTitle = contentEl.querySelector("h1");
                if (firstTitle) {
                    document.title = `${firstTitle.textContent} — Sc1xya`;
                }
            } catch (error) {
                contentEl.innerHTML = `
                    <p class="error">This post could not be loaded.</p>
                    <p class="error">Please check whether the markdown file exists.</p>
                `;
            }
        }

        loadPost();
    </script>
</body>
</html>
