<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post — Sc1xya</title>
    <link rel="icon" href="./pics/daisy.png" />
    <link rel="stylesheet" href="../css/post.css" />
</head>

<body>
    <header class="site-nav">
        <a class="brand" href="../index.html">Sc1xya</a>
        <nav aria-label="Primary navigation">
            <a href="../index.html">Home</a>
            <a href="./posts_black.html">Posts</a>
        </nav>
    </header>

    <main class="reading-shell">
        <article class="markdown-body" id="content"></article>
        <a class="back-link" href="./posts_black.html">Back to posts</a>
    </main>

    <script src="../js/marked.min.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const contentEl = document.getElementById("content");

        async function loadPost() {
            if (!id) {
                contentEl.innerHTML = '<p class="error">No post id provided.</p>';
                return;
            }

            if (window.location.protocol === "file:") {
                contentEl.innerHTML = `
                    <p class="error">This post cannot be loaded from a local file path.</p>
                    <p class="error">Please open the site through a published URL or a local static server.</p>
                `;
                return;
            }

            try {
                const postPath = `./posts/${encodeURIComponent(id)}.md`;
                const response = await fetch(postPath);
                if (!response.ok) {
                    throw new Error("Post not found");
                }

                const markdown = await response.text();
                contentEl.innerHTML = marked.parse(markdown);

                const titleEl = contentEl.querySelector("h1, h2, h3");
                if (titleEl) {
                    document.title = `${titleEl.textContent} — Sc1xya`;
                }
            } catch (error) {
                contentEl.innerHTML = `
                    <p class="error">This post could not be loaded.</p>
                    <p class="error">Please check whether the markdown file exists.</p>
                `;
            }
        }

        loadPost();

        document.addEventListener("copy", function(e) {
            const selection = window.getSelection().toString().trim();
            if (!selection || selection.length < 10) return;

            const extra = "\n\n—— 来自 Sc1xya's Universe";
            e.clipboardData.setData("text/plain", selection + extra);
            e.preventDefault();
        });
    </script>
</body>
</html>
