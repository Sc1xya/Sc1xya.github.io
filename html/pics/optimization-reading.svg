  <rect width="960" height="540" fill="url(#rg)"/>
  <text x="70" y="94" fill="#f2f0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="48" font-weight="760" letter-spacing="-3">Sc1xya</text>
  <rect x="70" y="116" width="220" height="2" fill="#c6a86b"/>
  <g transform="translate(390 86)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
