<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Optimization — Sc1xya</title>
    <link rel="stylesheet" href="../css/style_optimization.css" />
</head>
<body>
    <header class="hero">
        <a class="brand" href="../index.html">Sc1xya</a>
        <p class="eyebrow">Visual Notes</p>
        <h1>样式优化说明</h1>
        <p class="intro">这页用三张示意图说明本次优化的重点：更有层次的首页、更清晰的文章列表，以及更舒适的正文阅读体验。</p>
    </header>

    <main class="gallery" aria-label="样式优化示意图">
        <article class="card">
            <img src="./pics/optimization-landing.svg" alt="首页优化示意图：渐变氛围、响应式标题和金色 Enter 链接" />
            <div>
                <p class="label">01 / 首页</p>
                <h2>让第一屏更像入口</h2>
                <p>使用渐变光晕、细边框和金色强调线，保留暗色宇宙感，同时让标题与进入链接更醒目。</p>
            </div>
        </article>

        <article class="card">
            <img src="./pics/optimization-posts.svg" alt="文章列表优化示意图：卡片式文章项、日期列和 hover 状态" />
            <div>
                <p class="label">02 / 列表</p>
                <h2>让文章更容易浏览</h2>
                <p>文章列表改成语义化列表和卡片布局，日期与标题分栏展示，并通过 hover 状态提示可点击区域。</p>
            </div>
        </article>

        <article class="card">
            <img src="./pics/optimization-reading.svg" alt="正文页优化示意图：舒适行宽、Markdown 引用和代码样式" />
            <div>
                <p class="label">03 / 阅读</p>
                <h2>让正文更适合长读</h2>
                <p>正文页控制行宽和行高，并补充 Markdown 标题、引用、链接与行内代码样式，提升阅读节奏。</p>
            </div>
        </article>
    </main>
</body>
</html>
